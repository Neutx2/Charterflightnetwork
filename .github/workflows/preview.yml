name: Deploy site preview to GitHub Pages

on:
  push:
    branches: [claude/cfn-modernization-okp1pe]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Rewrite root-relative URLs for the /Charterflightnetwork/ subpath and
      # mark the preview noindex. Production deploys skip this step.
      - run: node scripts/make-preview.mjs /Charterflightnetwork
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
