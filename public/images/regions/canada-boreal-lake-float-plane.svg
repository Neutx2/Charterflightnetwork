<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Float plane on approach over a boreal lake in Canada">
  <!--
    Region card art, 480x300 — exactly the card's aspect, so nothing crops.
    Shared system across all four region cards:
      · horizon at y=170
      · the aircraft lives in the UPPER RIGHT (x>250, y<110). The card lays a
        lake-950 scrim plus the title and blurb over the bottom half, so a
        subject drawn low is simply never seen — which is what went wrong
        before: every plane sat behind the wordmark.
      · the same aircraft silhouette in all four, so the set reads as a family.
  -->
  <defs>
    <linearGradient id="cSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2033"/>
      <stop offset=".55" stop-color="#1d486b"/>
      <stop offset="1" stop-color="#4d8dbc"/>
    </linearGradient>
    <linearGradient id="cWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6f9f"/>
      <stop offset="1" stop-color="#0b2033"/>
    </linearGradient>
    <radialGradient id="cGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd08a" stop-opacity=".75"/>
      <stop offset="1" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="300" fill="url(#cSky)"/>
  <ellipse cx="118" cy="172" rx="150" ry="72" fill="url(#cGlow)"/>

  <path d="M0 158 L70 140 L150 156 L240 134 L330 154 L420 138 L480 152 L480 176 L0 176 Z" fill="#1d486b" opacity=".9"/>

  <g fill="#12271f">
    <rect y="168" width="480" height="14"/>
    <path d="M8 170 l7 -26 7 26 Z"/><path d="M30 170 l5 -19 5 19 Z"/><path d="M50 170 l8 -30 8 30 Z"/><path d="M74 170 l5 -21 5 21 Z"/><path d="M94 170 l7 -27 7 27 Z"/><path d="M116 170 l5 -18 5 18 Z"/><path d="M134 170 l8 -29 8 29 Z"/><path d="M158 170 l5 -20 5 20 Z"/><path d="M178 170 l7 -26 7 26 Z"/><path d="M200 170 l5 -19 5 19 Z"/><path d="M220 170 l8 -30 8 30 Z"/><path d="M244 170 l5 -21 5 21 Z"/><path d="M264 170 l7 -27 7 27 Z"/><path d="M286 170 l5 -18 5 18 Z"/><path d="M304 170 l8 -29 8 29 Z"/><path d="M328 170 l5 -20 5 20 Z"/><path d="M348 170 l7 -26 7 26 Z"/><path d="M370 170 l5 -19 5 19 Z"/><path d="M390 170 l8 -30 8 30 Z"/><path d="M414 170 l5 -21 5 21 Z"/><path d="M434 170 l7 -27 7 27 Z"/><path d="M456 170 l5 -18 5 18 Z"/>
  </g>

  <rect y="180" width="480" height="120" fill="url(#cWater)"/>
  <g stroke="#83b2d4" stroke-linecap="round" opacity=".2" fill="none">
    <path d="M40 206 h64" stroke-width="2.5"/><path d="M150 226 h80" stroke-width="2"/><path d="M330 214 h70" stroke-width="2"/>
  </g>

  <g transform="translate(296 36) rotate(-6)" fill="#07131f">
    <path d="M0 18c12-3 46-4 58-3l24 1.5c12 .8 16 8 8 10.5l-28 2.5c-24 1.5-52 0-62-11.5z"/>
    <path d="M34 9h54c3 0 4.4 2.5 3.2 4.7l-3.2 6.3H37c-2.5 0-4.3-1.8-4.3-4.3z"/>
    <path d="M6 16 L-21 5 l6 14 z"/>
    <rect x="18" y="33" width="46" height="4.2" rx="2.1"/>
    <rect x="52" y="33" width="40" height="4.2" rx="2.1"/>
    <path d="M32 24 l2 10h3l-1.6-10zM70 22 l1.4 12h3l-1-12z"/>
    <ellipse cx="92" cy="19" rx="1.7" ry="11" opacity=".35"/>
  </g>
</svg>
